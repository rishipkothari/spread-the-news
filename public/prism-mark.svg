<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="spectrumOut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6B82" />
      <stop offset="50%" stop-color="#7D858C" />
      <stop offset="100%" stop-color="#A65E4E" />
    </linearGradient>
    <linearGradient id="lensFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A1C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#181A1C" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Optical lens frame outline -->
  <path d="M 28 60 C 28 36, 44 24, 62 24 C 80 24, 94 38, 94 60 C 94 82, 78 96, 60 96 C 42 96, 28 84, 28 60 Z" 
        stroke="#181A1C" stroke-width="2.75" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Internal corrective prism geometric facet -->
  <polygon points="46,38 78,38 62,82" stroke="#181A1C" stroke-width="1.5" stroke-dasharray="2.5 2.5" fill="url(#lensFacet)" />

  <!-- Incident single neutral light beam -->
  <line x1="8" y1="60" x2="52" y2="60" stroke="#181A1C" stroke-width="2.75" stroke-linecap="round" />

  <!-- Refracted ideological spectrum rays (Left: Cobalt, Center: Slate, Right: Terracotta) -->
  <path d="M 62 60 L 108 44" stroke="#4A6B82" stroke-width="3" stroke-linecap="round" />
  <path d="M 62 60 L 112 60" stroke="#7D858C" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 62 60 L 108 76" stroke="#A65E4E" stroke-width="3" stroke-linecap="round" />

  <!-- Subtle focal node -->
  <circle cx="62" cy="60" r="2.5" fill="#181A1C" />
</svg>